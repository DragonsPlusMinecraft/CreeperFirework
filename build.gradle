plugins {
    id "architectury-plugin" version "3.5.169"
    id "dev.architectury.loom-no-remap" version "1.17.491" apply false
    id "com.gradleup.shadow" version "9.3.0" apply false
    id "me.modmuss50.mod-publish-plugin" version "2.1.1"
}


architectury {
    minecraft = rootProject.minecraft_version
}

allprojects {
    version = rootProject.mod_version
    group = rootProject.maven_group
}


subprojects {
    apply plugin: "dev.architectury.loom-no-remap"
    apply plugin: "architectury-plugin"
    apply plugin: "maven-publish"
    if (project.name != "common") {
        apply plugin: "com.gradleup.shadow"
    }

    base {
        // Set up a suffixed format for the mod jar names, e.g. `example-fabric`.
        archivesName = "$rootProject.name-$project.name"
    }

    repositories {
        // Add repositories to retrieve artifacts from in here.
        // You should only use this when depending on other mods because
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        options.release = Integer.parseInt(rootProject.java_version)
    }

    java {
        // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
        // if it is present.
        // If you remove this line, sources will not be generated.
        withSourcesJar()

        sourceCompatibility = JavaVersion.toVersion(rootProject.java_version)
        targetCompatibility = JavaVersion.toVersion(rootProject.java_version)
    }
}

publishMods {
    changelog = rootProject.file("CHANGELOG.md").text
    version = mod_version
    type = STABLE

    def cfOptions = curseforgeOptions {
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        projectId = "558439"
        minecraftVersions.add(minecraft_version)
        javaVersions.add(JavaVersion.toVersion(rootProject.java_version))
        client = true
        server = true
    }

    def mrOptions = modrinthOptions {
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        projectId = "owUiXPam"
        minecraftVersions.add(minecraft_version)
        environment = CLIENT_AND_SERVER
    }

    def createOptions = (String projectName) -> publishOptions {
        file = project(":$projectName").tasks.named(rootProject.publish_artifact_task).flatMap { it.archiveFile }
        displayName = "[${projectName.toUpperCase()}] Creeper Firework ${mod_version} for ${minecraft_version}"
        modLoaders.add(projectName.toLowerCase())
    }

    def fabricOptions = createOptions("fabric")
    def neoForgeOptions = createOptions("neoforge")

    curseforge("CFFabric") {
        from cfOptions, fabricOptions
        requires("fabric-api", "cloth-config")
    }

    curseforge("CFNeoForge") {
        from cfOptions, neoForgeOptions
    }

    modrinth("MRFabric") {
        from mrOptions, fabricOptions
        requires("fabric-api", "cloth-config")
    }

    modrinth("MRNeoForge") {
        from mrOptions, neoForgeOptions
    }
}
