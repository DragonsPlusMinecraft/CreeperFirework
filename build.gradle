plugins {
    id "architectury-plugin" version "3.4-SNAPSHOT"
    id "dev.architectury.loom" version "1.11-SNAPSHOT" apply false
    id 'com.gradleup.shadow' version '8.3.6' apply false
    id "me.modmuss50.mod-publish-plugin" version "0.7.4"
}


architectury {
    minecraft = rootProject.minecraft_version
}

allprojects {
    version = rootProject.mod_version
    group = rootProject.maven_group
}


subprojects {
    apply plugin: "dev.architectury.loom"
    apply plugin: "architectury-plugin"
    apply plugin: "maven-publish"

    base {
        // Set up a suffixed format for the mod jar names, e.g. `example-fabric`.
        archivesName = "$rootProject.name-$project.name"
    }

    repositories {
        // Add repositories to retrieve artifacts from in here.
        // You should only use this when depending on other mods because
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        mappings loom.layered {
            it.mappings("net.fabricmc:yarn:$rootProject.yarn_mappings:v2")
            it.mappings("dev.architectury:yarn-mappings-patch-neoforge:$rootProject.yarn_mappings_patch_neoforge_version")
        }
    }

    tasks.withType(JavaCompile) {
        options.encoding = "UTF-8"
        options.release = 21
    }

    java {
        // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
        // if it is present.
        // If you remove this line, sources will not be generated.
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 21
    }

    publishMods {
        changelog = rootProject.file("CHANGELOG.md").text
        version = mod_version
        type = STABLE

        def CFOption = curseforgeOptions {
            accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
            projectId = "558439"
            minecraftVersions.add(minecraft_version)
        }

        def MROption = modrinthOptions {
            accessToken = providers.environmentVariable("MODRINTH_TOKEN")
            projectId = "owUiXPam"
            minecraftVersions.add(minecraft_version)
        }

        def createOptions = (String projectName) -> {
            publishOptions {
                file = project.provider { project(":$projectName").tasks.remapJar }.flatMap { it.archiveFile }
                displayName = "[${projectName.toUpperCase()}] Creeper Firework ${mod_version} for ${minecraft_version}"
                modLoaders.add(projectName.toLowerCase())
            }
        }

        def FabricOptions = createOptions("fabric")
        def NeoForgeOptions = createOptions("neoforge")

        curseforge("CFFabric") {
            from (CFOption,FabricOptions)
        }

        curseforge("CFNeoForge") {
            from (CFOption,NeoForgeOptions)
        }

        modrinth("MRFabric") {
            from (MROption,FabricOptions)
        }

        modrinth("MRNeoForge") {
            from (MROption,NeoForgeOptions)
        }
    }
}
